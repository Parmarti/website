[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "fanout"
version = "0.1.0"
description = "Official Python SDK for the Fanout unified social media API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["social media", "api", "scheduling", "twitter", "linkedin", "instagram", "tiktok", "bluesky"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["fanout"]
